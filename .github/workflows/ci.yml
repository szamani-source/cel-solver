name: build-and-test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: opencfd/openfoam-dev:2512
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install Python (used by tests and Phase 1 prototypes)
        # OpenFOAM is already in the image; its apt repository (dl.openfoam.com) is not
        # needed here and failed during a mirror sync (2026-11-15), so it is dropped
        # before the update.
        run: |
          grep -rl openfoam /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f
          apt-get update -qq && apt-get install -y -qq python3 python3-numpy

      - name: Build
        shell: bash
        run: |
          source /usr/lib/openfoam/openfoam2512/etc/bashrc || true
          ./Allwmake

      - name: Regression tests
        shell: bash
        run: |
          source /usr/lib/openfoam/openfoam2512/etc/bashrc || true
          tests/run_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: tests/*.log
